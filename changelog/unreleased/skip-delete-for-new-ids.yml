title: "Without an update log and outside SolrCloud, DirectUpdateHandler2 adds documents whose ID cannot be in the index yet without the delete of an earlier version, which saves the CPU Lucene spends applying those deletes. Set solr.update.skipDeleteForNewIds=false to turn it off."
